[package]
name = "pop-forge"
version = "0.1.0"
edition = "2021"
description = "POP Forge : application de bureau Windows de POP (UEFN)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tokio = { version = "1", features = ["time"] }
# UEFN Link (#77) : le relais tourne dans Forge.
pop-link = { path = "../link" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
