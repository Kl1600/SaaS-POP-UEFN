[package]
name = "pop-forge"
version = "0.1.0"
edition = "2021"
description = "POP Forge : application de bureau Windows de POP (UEFN)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Ouvrir le site POP et les liens externes dans le navigateur de l’utilisateur.
tauri-plugin-opener = "2"
# « Parcourir… » : choisir le dossier d’un projet UEFN.
tauri-plugin-dialog = "2"
# Mises à jour automatiques signées (#79).
tauri-plugin-updater = "2"
# Lien « pop-forge://… » ouvert depuis le site (#297) ; une seule fenêtre de Forge reçoit le lien.
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tokio = { version = "1", features = ["time"] }
# UEFN Link (#77) : le relais tourne dans Forge.
pop-link = { path = "../link" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Vrai dossier Documents de Windows, même déplacé (projets UEFN).
dirs = "7"
# Capture de l'écran du jeu pendant un scénario de test (#350), envoyée à POP en base64.
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
xcap = "0.9"
