# Construit l'image de production de POP et la publie sur GitHub Container Registry (ghcr.io).
# Le serveur (Hetzner CPX02, 1 Go de RAM) ne compile jamais : il télécharge cette image (voir deploy/README.md).
# Étiquettes : `latest` (dernier main) et `sha-<commit>` (pour revenir à une version précise).
name: publier l'image

on:
  push:
    branches: [main]
    paths: [Dockerfile, .dockerignore, server/**, web/**, .github/workflows/publier-image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publier-image
  cancel-in-progress: true

jobs:
  publier:
    name: construire et publier (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
