# Met POP en ligne sur le serveur, d'un clic : onglet Actions → « déployer » → Run workflow (voir deploy/README.md,
# « Déployer depuis GitHub »). Jamais automatique : une nouvelle version peut migrer la base, on choisit le moment.
# 1. On trouve le commit demandé (latest = la tête de main) et on regarde si son image `sha-<7 caractères>` existe
#    sur ghcr.io. 2. Sinon, on la construit (« publier l'image ») : on ne construit plus à chaque fusion (#52).
# 3. Le runner se connecte en SSH avec une clé qui ne peut lancer que /opt/pop/deployer.sh sur le serveur ; ce script
#    télécharge cette image précise, redémarre POP et vérifie que le site répond. 4. `latest` désigne alors l'image
#    déployée. Si la construction échoue, rien n'est déployé : le serveur garde sa version.
# Secrets du dépôt (Settings → Secrets and variables → Actions) : DEPLOY_HOST, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS.
# Pas d'environnement GitHub : ils demandent un abonnement payant sur un dépôt privé. Seul le propriétaire du
# dépôt peut créer ces secrets.
name: déployer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "latest (dernier main) ou sha-<7 caractères du commit> pour une version précise"
        required: true
        default: latest

permissions:
  contents: read

concurrency:
  group: deployer
  cancel-in-progress: false

jobs:
  resoudre:
    name: version à déployer
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: read
    outputs:
      commit: ${{ steps.v.outputs.commit }}
      image: ${{ steps.v.outputs.image }}
      existe: ${{ steps.v.outputs.existe }}
    steps:
      - name: Vérifier les secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          manque=""
          [ -n "$DEPLOY_HOST" ] || manque="$manque DEPLOY_HOST"
          [ -n "$DEPLOY_SSH_KEY" ] || manque="$manque DEPLOY_SSH_KEY"
          [ -n "$DEPLOY_KNOWN_HOSTS" ] || manque="$manque DEPLOY_KNOWN_HOSTS"
          if [ -n "$manque" ]; then
            echo "::error::Secrets du dépôt manquants :$manque (voir deploy/README.md)."; exit 1
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$VERSION" =~ ^(latest|sha-[0-9a-f]{7,40})$ ]]; then
            echo "::error::Version « $VERSION » refusée : latest ou sha-<7 caractères du commit>."; exit 1
          fi
          ref=main
          [ "$VERSION" = latest ] || ref=${VERSION#sha-}
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$ref" --jq .sha) || {
            echo "::error::Commit « $ref » introuvable dans le dépôt."; exit 1; }
          image=$(echo "ghcr.io/$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]'):sha-${commit:0:7}
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "existe=oui" >> "$GITHUB_OUTPUT"
            echo "::notice::Image déjà publiée : $image (commit ${commit:0:7}), rien à construire."
          else
            echo "existe=non" >> "$GITHUB_OUTPUT"
            echo "::notice::Image absente : construction de $image (commit ${commit:0:7}) avant le déploiement."
          fi

  construire:
    name: construire l'image
    needs: resoudre
    if: needs.resoudre.outputs.existe == 'non'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publier-image.yml
    with:
      commit: ${{ needs.resoudre.outputs.commit }}

  deployer:
    name: mettre à jour le serveur
    needs: [resoudre, construire]
    # Image déjà publiée (construction sautée) ou construite à l'instant ; jamais après une construction en échec.
    if: >-
      always() && needs.resoudre.result == 'success' &&
      (needs.construire.result == 'success' || needs.construire.result == 'skipped')
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Déployer sur le serveur
        env:
          IMAGE: ${{ needs.resoudre.outputs.image }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deployer
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deployer ~/.ssh/known_hosts
          # On envoie l'étiquette précise (sha-…), jamais « latest » : le serveur installe exactement cette image.
          # StrictHostKeyChecking=yes : si l'empreinte du serveur ne correspond pas, on refuse de se connecter.
          ssh -i ~/.ssh/deployer -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
            -o ConnectTimeout=20 "pop-admin@$DEPLOY_HOST" "${IMAGE##*:}"

      - name: Effacer la clé
        if: always()
        run: rm -f ~/.ssh/deployer

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      # « latest » = la dernière image déployée (le « docker compose up -d » à la main sur le serveur la garde).
      - name: latest désigne l'image déployée
        env:
          IMAGE: ${{ needs.resoudre.outputs.image }}
        run: |
          docker buildx imagetools create -t "${IMAGE%:*}:latest" "$IMAGE"
          empreinte() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r .digest; }
          a=$(empreinte "$IMAGE"); b=$(empreinte "${IMAGE%:*}:latest")
          if [ "$a" != "$b" ]; then
            echo "::error::latest ($b) ne désigne pas l'image déployée $IMAGE ($a)."; exit 1
          fi
          echo "::notice::En ligne : $IMAGE ; latest désigne maintenant cette image ($a)."

  # Notes de version et Discord (#185). Après un déploiement réussi : une release `deploy-AAAA-MM-JJ-<sha>` dont les
  # notes listent les changements de main depuis la release de déploiement précédente, postées aussi dans
  # #deploiements (secret DISCORD_WEBHOOK_DEPLOIEMENTS). Après un échec : un court message avec le lien des journaux.
  # Discord ne fait jamais échouer ce job (continue-on-error) ; sans le secret, le message est sauté.
  annoncer:
    name: notes de version et Discord
    needs: [resoudre, construire, deployer]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      COMMIT: ${{ needs.resoudre.outputs.commit || github.sha }}
      REUSSI: ${{ needs.deployer.result == 'success' }}
      JOURNAUX: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Créer la release
        id: release
        if: env.REUSSI == 'true'
        run: |
          precedente=$(gh release list --limit 100 --json tagName \
            --jq '[.[] | select(.tagName | startswith("deploy-"))][0].tagName // ""')
          de=""
          [ -n "$precedente" ] && de=$(git rev-list -n 1 "refs/tags/$precedente")
          echo "Release précédente : ${precedente:-aucune} ${de:0:7}"
          python3 tools/discord.py notes --de "$de" --a "$COMMIT" > "$RUNNER_TEMP/notes.md"
          tag="deploy-$(date -u +%Y-%m-%d)-${COMMIT:0:7}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$COMMIT" --latest \
              --title "Mise en ligne du $(date -u +%d/%m/%Y) · ${COMMIT:0:7}" --notes-file "$RUNNER_TEMP/notes.md"
          else
            echo "::notice::La release $tag existe déjà (même version redéployée le même jour)."
          fi
          echo "url=$(gh release view "$tag" --json url --jq .url)" >> "$GITHUB_OUTPUT"
      - name: Message Discord
        # Même si la release a échoué : le site est en ligne, on l'annonce (sans notes).
        if: always()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_DEPLOIEMENTS }}
          RELEASE: ${{ steps.release.outputs.url }}
        run: |
          if [ "$REUSSI" = true ]; then
            python3 tools/discord.py deploiement --statut ok --commit "$COMMIT" \
              --notes "$RUNNER_TEMP/notes.md" --release "$RELEASE"
          else
            python3 tools/discord.py deploiement --statut echec --commit "$COMMIT" --journaux "$JOURNAUX"
          fi
