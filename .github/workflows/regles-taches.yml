# Fait respecter les règles des tâches (AGENTS.md §0 et §4) sur chaque issue, quel que soit le chemin
# (tools/task.py, le site GitHub, un agent qui passe par l'API) :
#   - une issue fermée alors qu'une dépendance est ouverte est rouverte ;
#   - une issue fermée « terminée » sans commentaire « Vérifié par : » (ou l'ancien « Validé par : ») est rouverte
#     (pour abandonner une tâche, fermez-la en « Not planned ») ;
#   - « en cours » ou « en revue » posé sur une issue bloquée est retiré ;
#   - une issue fermée perd ses étiquettes de statut.
name: règles des tâches

on:
  issues:
    types: [closed, labeled]

permissions:
  issues: write

jobs:
  appliquer:
    # Seuls une fermeture et « en cours » / « en revue » ont une règle : les autres étiquettes (priorité, domaine,
    # type, « bloqué ») sautent le job, qui ne coûte alors rien (#46).
    if: >-
      github.event.action == 'closed' ||
      contains(fromJSON('["en cours", "en revue"]'), github.event.label.name)
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const number = issue.number;
            const STATUS = ['en cours', 'en revue', 'bloqué'];

            const deps = await github.request(
              'GET /repos/{owner}/{repo}/issues/{issue_number}/dependencies/blocked_by',
              { owner, repo, issue_number: number });
            const open = deps.data.filter(d => d.state === 'open');
            const list = open.map(d => `#${d.number} ${d.title}`).join(', ');
            const say = body => github.rest.issues.createComment({ owner, repo, issue_number: number, body });

            if (context.payload.action === 'closed') {
              let reason = '';
              if (open.length) {
                reason = `Rouverte : bloquée par ${list}. On ne ferme une tâche qu'une fois ses dépendances faites.`;
              } else if (issue.state_reason !== 'not_planned') {
                const comments = await github.paginate(github.rest.issues.listComments,
                  { owner, repo, issue_number: number, per_page: 100 });
                if (!comments.some(c => /^(Vérifié|Validé) par :/m.test(c.body))) {
                  reason = `Rouverte : aucune vérification notée. Une tâche se ferme avec « python tools/task.py done ${number} --verifie "…" » une fois chaque critère vérifié et le CI vert. Pour l'abandonner, fermez-la en « Not planned ».`;
                }
              }
              if (reason) {
                await github.rest.issues.update({ owner, repo, issue_number: number, state: 'open' });
                await say(reason);
                core.notice(reason);
                return;
              }
              for (const name of issue.labels.map(l => l.name).filter(n => STATUS.includes(n))) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name }).catch(() => {});
              }
            }

            if (context.payload.action === 'labeled' && ['en cours', 'en revue'].includes(context.payload.label.name) && open.length) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name: context.payload.label.name });
              await say(`« ${context.payload.label.name} » retiré : pas encore commençable, bloquée par ${list}.`);
            }
