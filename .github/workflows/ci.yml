# CI complet, lancé seulement par un déploiement (décision du 22/11 dans KB/DECISIONS.md) : « déployer » l'appelle
# sur le commit qu'il va mettre en ligne et ne déploie rien si un contrôle échoue. Plus de CI sur les PR ni à
# chaque fusion sur main : avec un seul runner local, il retardait tout le monde. Tout est contrôlé à chaque fois ;
# les deux règles qui comparent à un état précédent (migrations jamais modifiées, relais téléchargeable à jour)
# comparent au dernier déploiement (étiquette `deploy-…` de sa release).
# On peut aussi le lancer à la main : onglet Actions → CI → Run workflow.
# Runner : `vars.RUNNER` (variable du dépôt) envoie les jobs Linux sur un runner local, par exemple quand les minutes
# gratuites de GitHub sont épuisées ; sans la variable, ils tournent chez GitHub (voir KB/RUNNER.md).
name: CI

on:
  workflow_call:
    inputs:
      commit:
        description: commit complet à contrôler
        type: string
        required: true
  workflow_dispatch:
    inputs:
      commit:
        description: "commit à contrôler (vide = la branche choisie ci-dessus)"
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  COMMIT: ${{ inputs.commit || github.sha }}

jobs:
  serveur:
    name: serveur (build + tests)
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      # Format unique du code Rust (#8) : en cas d'échec, lancez « cargo fmt » dans server/ et commitez.
      - run: cargo fmt --check
        working-directory: server
      - run: cargo build --locked
        working-directory: server
      - run: cargo test --locked
        working-directory: server

  relais:
    name: relais pop-link (build + tests)
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: link
      # Format unique du code Rust (#8) : en cas d'échec, lancez « cargo fmt » dans link/ et commitez.
      - run: cargo fmt --check
        working-directory: link
      - run: cargo build --locked
        working-directory: link
      - run: cargo test --locked
        working-directory: link

  # POP Forge (#76) : application Windows. L'installateur non signé (bêta) est gardé en artefact de l'exécution.
  forge:
    name: forge (Windows, build + installateur)
    # Runner local (vars.RUNNER, voir KB/RUNNER.md) : il est Linux, Forge est sautée ; à lancer à la main si besoin.
    if: vars.RUNNER == ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: forge
      - run: cargo fmt --check
        working-directory: forge
      - run: cargo test --locked
        working-directory: forge
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @tauri-apps/cli@2 build --bundles nsis -- --locked
        working-directory: forge
      - uses: actions/upload-artifact@v4
        with:
          name: pop-forge-installateur
          path: forge/target/release/bundle/nsis/*.exe
          retention-days: 14

  web:
    name: web (types + build + dist à jour)
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npx tsc -b
        working-directory: web
      - run: npx vite build
        working-directory: web
      # web/dist est versionné pour lancer POP sans Node : il doit correspondre aux sources.
      - name: web/dist correspond aux sources
        run: |
          if [ -n "$(git status --porcelain -- web/dist)" ]; then
            git status --short -- web/dist | head -20
            echo "::error::web/dist n'est pas à jour : lancez « npm run build » dans web/ et commitez web/dist."
            exit 1
          fi

  # Règles qui comparent au dernier déploiement, et failles connues, dans un seul job (GitHub arrondit chaque job
  # à la minute).
  verifications:
    name: migrations, relais et dépendances
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
          fetch-depth: 0
      - name: dernier déploiement
        id: dernier
        run: |
          tag=$(git tag -l 'deploy-*' --sort=-creatordate | head -1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Comparé à ${tag:-aucun déploiement précédent}"
      # Une migration existante ne se modifie jamais : on en ajoute une nouvelle, numérotée à la suite.
      - name: seules des migrations nouvelles
        if: steps.dernier.outputs.tag != ''
        env:
          BASE: ${{ steps.dernier.outputs.tag }}
        run: |
          changed=$(git diff --name-status "$BASE" HEAD -- server/migrations | grep -v '^A' || true)
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::Une migration existante a été modifiée, renommée ou supprimée depuis $BASE : créez plutôt une nouvelle migration numérotée à la suite."
            exit 1
          fi
          echo "Dernière migration : $(ls server/migrations | sort | tail -1)"
      # Le relais proposé au téléchargement était resté sur une vieille version (#158) : un changement du code du
      # relais doit aussi apporter l'exécutable recompilé (AGENTS.md §5).
      - name: relais téléchargeable à jour
        if: steps.dernier.outputs.tag != ''
        env:
          BASE: ${{ steps.dernier.outputs.tag }}
        run: |
          src=$(git diff --name-only "$BASE" HEAD -- link/src link/Cargo.toml link/Cargo.lock link/build.rs)
          exe=$(git diff --name-only "$BASE" HEAD -- web/public/downloads/pop-link.exe)
          if [ -n "$src" ] && [ -z "$exe" ]; then
            echo "::error::link/ a changé depuis $BASE mais pas web/public/downloads/pop-link.exe. Recompilez sous Windows (cd link && cargo build --release), copiez link/target/release/pop-link.exe dans web/public/downloads/, reconstruisez le web (cd web && npm run build) et commitez."
            exit 1
          fi
      # Rust n'est préinstallé que chez GitHub : un runner local (vars.RUNNER) a besoin de cette étape.
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Échoue sur toute faille connue de la base RustSec. Les exceptions, justifiées une par une,
      # sont dans <dossier>/.cargo/audit.toml (aujourd'hui : server/ seulement).
      - name: cargo audit (serveur)
        run: cargo audit
        working-directory: server
      - name: cargo audit (relais)
        run: cargo audit
        working-directory: link
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Dépendances livrées dans l'interface seulement ; échoue à partir de la gravité élevée.
      - name: npm audit (web)
        run: npm audit --omit=dev --audit-level=high
        working-directory: web
