# Contrôles de main, après chaque fusion (décision du 22/11 dans KB/DECISIONS.md : plus de CI sur les PR, il
# ralentissait tout le monde sans pouvoir être imposé). Chaque run compare main au dernier commit de main dont le
# CI était vert : un run annulé par une fusion plus récente ne laisse donc rien passer sans contrôle.
# Pour rester sous le quota gratuit de GitHub Actions (#46), chaque contrôle ne tourne que si ce qu'il vérifie a
# changé ; un contrôle sauté ne coûte rien. Modifier ce fichier fait tout tourner.
# Runner : `vars.RUNNER` (variable du dépôt) envoie les jobs Linux sur un runner local, par exemple quand les minutes
# gratuites de GitHub sont épuisées ; sans la variable, ils tournent chez GitHub (voir KB/RUNNER.md).
name: CI

on:
  push:
    branches: [main]
  # Failles publiées sans changement de code : audit des dépendances chaque lundi.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # retrouver le dernier commit de main dont le CI était vert

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changements:
    name: dossiers touchés
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    outputs:
      serveur: ${{ steps.f.outputs.serveur }}
      relais: ${{ steps.f.outputs.relais }}
      relais_src: ${{ steps.f.outputs.relais_src }}
      relais_exe: ${{ steps.f.outputs.relais_exe }}
      forge: ${{ steps.f.outputs.forge }}
      web: ${{ steps.f.outputs.web }}
      migrations: ${{ steps.f.outputs.migrations }}
      audit: ${{ steps.f.outputs.audit }}
      base: ${{ steps.f.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tout=0
          # Dernier commit de main au CI vert : les fusions annulées entre-temps sont contrôlées avec celle-ci.
          runs="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1"
          vert=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$runs" | jq -r '.workflow_runs[0].head_sha // empty' || true)
          case "$EVENT" in
            push)
              if [ -n "$vert" ] && git merge-base --is-ancestor "$vert" HEAD 2>/dev/null; then base=$vert; else base=$BEFORE; fi
              echo "Comparé à $base (dernier vert : ${vert:-aucun})" ;;
            schedule) base= ;;
            *) tout=1 ;;
          esac
          if [ "$EVENT" = schedule ]; then
            files=
          elif [ "$tout" = 1 ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            # Lancement à la main, première poussée ou historique réécrit : on vérifie tout.
            tout=1
            files=
          else
            files=$(git diff --name-only "$base" HEAD)
          fi
          echo "$files" | sed 's/^/  /'
          if printf '%s\n' "$files" | grep -q '^\.github/workflows/ci\.yml$'; then tout=1; fi
          touche() { [ "$tout" = 1 ] || printf '%s\n' "$files" | grep -Eq "$1"; }
          out() { if touche "$2"; then echo "$1=1"; else echo "$1=0"; fi >> "$GITHUB_OUTPUT"; }
          out serveur '^server/'
          out relais '^link/'
          # Relais téléchargeable (#158) : POP Forge embarque le relais (#404) ; son code et l'installateur proposé dans
          # POP changent ensemble.
          out relais_src '^(link/(src/|Cargo\.(toml|lock)$|build\.rs$)|forge/(src/|ui/|capabilities/|Cargo\.(toml|lock)$|build\.rs$|tauri\.conf\.json$))'
          out relais_exe '^web/public/downloads/pop-forge-setup\.exe$'
          # Forge embarque le relais (#77) : il se reconstruit aussi quand link/ change.
          out forge '^(forge|link)/'
          out web '^web/'
          out migrations '^server/migrations/'
          echo "base=$base" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = schedule ]; then echo "audit=1" >> "$GITHUB_OUTPUT"
          else out audit '^(server|link)/(Cargo\.(lock|toml)|\.cargo/audit\.toml)$|^web/package(-lock)?\.json$'; fi
          cat "$GITHUB_OUTPUT"

  serveur:
    name: serveur (build + tests)
    needs: changements
    if: needs.changements.outputs.serveur == '1'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      # Format unique du code Rust (#8) : en cas d'échec, lancez « cargo fmt » dans server/ et commitez.
      - run: cargo fmt --check
        working-directory: server
      - run: cargo build --locked
        working-directory: server
      - run: cargo test --locked
        working-directory: server

  # Le relais proposé au téléchargement était resté sur une vieille version (#158) : un changement du code du
  # relais doit aussi apporter l'exécutable recompilé (AGENTS.md §5).
  relais-telechargeable:
    name: relais téléchargeable à jour
    needs: changements
    if: needs.changements.outputs.relais_src == '1'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - env:
          EXE: ${{ needs.changements.outputs.relais_exe }}
        run: |
          if [ "$EXE" != 1 ]; then
            echo "::error::link/ ou forge/ a changé mais pas web/public/downloads/pop-forge-setup.exe. Attendez le commit du workflow « relais Windows » sur la branche (#358), ou construisez l'installateur sous Windows (cd forge && npx @tauri-apps/cli@2 build --bundles nsis), copiez-le dans web/public/downloads/pop-forge-setup.exe, reconstruisez le web (cd web && npm run build) et commitez."
            exit 1
          fi
          echo "Installateur de POP Forge mis à jour avec le code du relais."

  relais:
    name: relais pop-link (build + tests)
    needs: changements
    if: needs.changements.outputs.relais == '1'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: link
      # Format unique du code Rust (#8) : en cas d'échec, lancez « cargo fmt » dans link/ et commitez.
      - run: cargo fmt --check
        working-directory: link
      - run: cargo build --locked
        working-directory: link
      - run: cargo test --locked
        working-directory: link

  # POP Forge (#76) : application Windows, construite seulement quand forge/ ou link/ change (minutes Windows
  # comptées double). L'installateur non signé (bêta) est gardé en artefact de l'exécution.
  forge:
    name: forge (Windows, build + installateur)
    needs: changements
    # Runner local (vars.RUNNER, voir KB/RUNNER.md) : il est Linux, Forge est sautée ; à lancer à la main si besoin.
    if: needs.changements.outputs.forge == '1' && vars.RUNNER == ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: forge
      - run: cargo fmt --check
        working-directory: forge
      - run: cargo test --locked
        working-directory: forge
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @tauri-apps/cli@2 build --bundles nsis -- --locked
        working-directory: forge
      - uses: actions/upload-artifact@v4
        with:
          name: pop-forge-installateur
          path: forge/target/release/bundle/nsis/*.exe
          retention-days: 14

  web:
    name: web (types + build + dist à jour)
    needs: changements
    if: needs.changements.outputs.web == '1'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npx tsc -b
        working-directory: web
      - run: npx vite build
        working-directory: web
      # web/dist est versionné pour lancer POP sans Node : il doit correspondre aux sources.
      - name: web/dist correspond aux sources
        run: |
          if [ -n "$(git status --porcelain -- web/dist)" ]; then
            git status --short -- web/dist | head -20
            echo "::error::web/dist n'est pas à jour : lancez « npm run build » dans web/ et commitez web/dist."
            exit 1
          fi

  # Migrations et failles connues dans un seul job : GitHub arrondit chaque job à la minute.
  verifications:
    name: migrations et dépendances
    needs: changements
    if: >-
      needs.changements.outputs.audit == '1' ||
      (github.event_name == 'push' && needs.changements.outputs.migrations == '1')
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Une migration existante ne se modifie jamais : on en ajoute une nouvelle, numérotée à la suite.
      - name: seules des migrations nouvelles
        if: github.event_name == 'push' && needs.changements.outputs.migrations == '1'
        env:
          BASE: ${{ needs.changements.outputs.base }}
        run: |
          changed=$(git diff --name-status "$BASE" HEAD -- server/migrations | grep -v '^A' || true)
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::Une migration existante a été modifiée, renommée ou supprimée : créez plutôt une nouvelle migration numérotée à la suite."
            exit 1
          fi
          last=$(ls server/migrations | sort | tail -1)
          echo "Dernière migration : $last"
      # Rust n'est préinstallé que chez GitHub : un runner local (vars.RUNNER) a besoin de cette étape.
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changements.outputs.audit == '1'
      - uses: taiki-e/install-action@v2
        if: needs.changements.outputs.audit == '1'
        with:
          tool: cargo-audit
      # Échoue sur toute faille connue de la base RustSec. Les exceptions, justifiées une par une,
      # sont dans <dossier>/.cargo/audit.toml (aujourd'hui : server/ seulement).
      - name: cargo audit (serveur)
        if: needs.changements.outputs.audit == '1'
        run: cargo audit
        working-directory: server
      - name: cargo audit (relais)
        if: needs.changements.outputs.audit == '1'
        run: cargo audit
        working-directory: link
      - uses: actions/setup-node@v4
        if: needs.changements.outputs.audit == '1'
        with:
          node-version: 22
      # Dépendances livrées dans l'interface seulement ; échoue à partir de la gravité élevée.
      - name: npm audit (web)
        if: needs.changements.outputs.audit == '1'
        run: npm audit --omit=dev --audit-level=high
        working-directory: web
