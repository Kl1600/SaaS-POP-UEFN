[package]
name = "pop-link"
version = "0.1.0"
edition = "2021"
description = "UEFN Link : relais local entre UEFN et POP"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
axum = "0.8"
anyhow = "1"
rand = "0.8"
# Blender (#351) : décompression du zip officiel.
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

# Isolation de Blender (#351) : AppContainer et Job Object.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Isolation", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Threading"] }
